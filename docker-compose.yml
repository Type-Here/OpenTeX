services:
  mongo:
    image: mongo:8.0.23
    container_name: opentex-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
      # Workaround for MongoDB 8.0 crash on Linux kernel >= 6.8 (rseq ABI conflict)
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: opentex-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DB}?authSource=admin
      MONGO_DB: ${MONGO_DB}
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-false}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - media_files:/app/media     # mount filesystem per i file LaTeX/media (NO embedding in Mongo)

volumes:
  mongo_data:
  media_files:
